name: Build and Deploy MLOps

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t abhi23631/mlops-house-prediction:latest .

      - name: Push Docker Image
        run: |
          docker push \
            abhi23631/mlops-house-prediction:latest


  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull abhi23631/mlops-house-prediction:latest

            docker rm -f mlops-house-prediction || true

            docker run -d \
              --name mlops-house-prediction \
              -p 8002:8000 \
              abhi23631/mlops-house-prediction:latest

            docker ps